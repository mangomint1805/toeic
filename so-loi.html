<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#a8691a">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--paper:#faf8f4;--card:#fff;--line:#ddd7c9;--ink:#1e232b;--dim:#666e7a;--panel2:#f2efe8;--brand:#a8691a;--brand-soft:#f2e2c4;--brand-ink:#6b4410;--ok:#1f8f6c;--ok-soft:#e1f4ec;--bad:#c14636;--bad-soft:#fbe6e2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 50px}
header{padding:26px 0 8px}
.mback{font-size:14px;font-weight:700;color:var(--brand-ink);text-decoration:none}
h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:clamp(28px,6vw,40px);margin:10px 0 4px;line-height:1.1}
header p{margin:0;color:var(--dim)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lbl{font-size:13px;font-weight:700;color:var(--dim);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.chip{font:inherit;font-weight:600;font-size:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.chip small{font-weight:500;opacity:.8}
.btn{font:inherit;font-weight:700;font-size:16px;border:0;background:var(--brand);color:#fff;border-radius:12px;padding:12px 20px;cursor:pointer}
.btn.alt{background:var(--card);color:var(--brand-ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.hint{font-size:13px;color:var(--dim)}
.best{display:flex;gap:10px;margin-top:12px}
.best div{flex:1;background:var(--panel2);border-radius:12px;padding:8px 12px}.best b{display:block;font:600 24px/1.1 Fraunces,Georgia,serif;color:var(--brand-ink)}.best span{font-size:12.5px;color:var(--dim)}
/* sổ lỗi sai */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.sum div{flex:1;min-width:130px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.sum b{display:block;font:600 28px/1.1 Fraunces,Georgia,serif;color:var(--brand-ink)}.sum span{font-size:13px;color:var(--dim)}
.grp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0}
.grp h2{font:600 20px/1.2 Fraunces,Georgia,serif;color:var(--brand-ink);margin:0 0 8px}
.pr{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;padding:8px 0;border-top:1px dashed var(--line)}
.pr:first-of-type{border-top:0}
.pr .pl{min-width:150px;font-weight:700;font-size:14.5px}.pr .pl small{display:block;font-weight:500;color:var(--dim);font-size:12.5px}
.ns{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.ns a{min-width:44px;text-align:center;font-weight:700;font-size:14px;padding:5px 8px;border-radius:8px;border:1.5px solid #f0c2ba;background:#fbe6e2;color:#a3392b;text-decoration:none}
.ns a small{display:block;font-size:10.5px;font-weight:600;opacity:.75}.ns.soon a{border-color:var(--line);background:var(--card);color:var(--ink)}h2.sec{font:600 21px/1.2 Fraunces,Georgia,serif;margin:20px 0 4px}
.redo{display:inline-block;margin-top:10px;text-decoration:none;font-size:15px;padding:10px 16px}
.empty{text-align:center;padding:30px 10px;color:var(--dim)}
.empty .et{display:block;font:600 20px/1.3 Fraunces,Georgia,serif;color:var(--ink);margin-bottom:6px}
</style>
</head>
<body data-nav="marks">
<div class="wrap">
  <header>
    <a class="mback" href="./">← Trang chủ</a>
    <h1>📕 Sổ lỗi sai</h1>
    <p>Mọi câu bạn làm sai trong đề luyện, đề thi thử, đề mini và Đào vàng tự vào đây, rồi được hẹn ngày ôn lại: sau 1 ngày, 3 ngày, 7 ngày. Đúng đủ 3 lần thì câu đó rời sổ. Đăng nhập Google để sổ đi theo bạn trên mọi máy.</p>
  </header>
  <div class="sum" id="sum"></div>
  <div class="tabs" id="tabs"></div>
  <div id="main"></div>
</div>
<script>
(function(){
  var PN={1:'Mô tả tranh',2:'Hỏi – đáp',3:'Hội thoại',4:'Bài nói',5:'Điền câu',6:'Điền đoạn văn',7:'Đọc hiểu'};
  var main=document.getElementById('main'), tabs=document.getElementById('tabs'), F=0;
  function get(k,d){ try{ var v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } }
  function pOf(n){ return n<=6?1:n<=31?2:n<=70?3:n<=100?4:n<=130?5:n<=146?6:7; }
  function tname(t){ return t>10?'ETS 2024 · Test '+(t-10):'ETS 2026 · Test '+t; }
  var TD=(function(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); })();
  var TH=['CN','T2','T3','T4','T5','T6','T7'];
  function dayLbl(d){ var x=new Date(d+'T00:00:00'), n=Math.round((x-new Date(TD+'T00:00:00'))/864e5); return n===1?'Ngày mai':TH[x.getDay()]+', '+d.slice(8)+'/'+d.slice(5,7)+(n>1?' · còn '+n+' ngày':''); }
  // sổ có lịch ôn (ui.js MERR, khoá mt.errlog): sai → ôn lại sau 1 ngày, đúng → sau 3 ngày, rồi 7 ngày; đúng lần thứ 3 thì rời sổ
  function collect(){
    var L=window.MERR?window.MERR.all():{};
    return Object.keys(L).map(function(k){ var sp=k.split('.'), x=L[k]; return {t:+sp[0],n:+sp[1],p:x.p||pOf(+sp[1]),s:x.s||0,d:x.d||TD,due:(x.d||TD)<=TD}; }).filter(function(x){ return x.t&&x.n; });
  }
  function link(t,ns,label,cls){ return '<a class="'+(cls||'btn redo')+'" href="test.html?t='+t+'&m=sai&q='+ns.join(',')+'">'+label+'</a>'; }
  function render(){
    var L=collect(), byP={}; L.forEach(function(x){ byP[x.p]=(byP[x.p]||0)+1; });
    var dueAll=L.filter(function(x){return x.due;});
    document.getElementById('sum').innerHTML='<div><b>'+dueAll.length+'</b><span>câu đến hạn ôn hôm nay</span></div><div><b>'+L.length+'</b><span>câu đang trong sổ</span></div>'+
      (L.length?'<div><b>'+(function(){ var m=0,mp=0; Object.keys(byP).forEach(function(p){ if(byP[p]>m){m=byP[p];mp=p;} }); return 'Part '+mp; })()+'</b><span>sai nhiều nhất</span></div>':'');
    tabs.innerHTML=L.length?['<button class="chip" data-f="0" aria-pressed="'+(F===0)+'">Tất cả <small>'+L.length+'</small></button>'].concat([1,2,3,4,5,6,7].filter(function(p){return byP[p];}).map(function(p){ return '<button class="chip" data-f="'+p+'" aria-pressed="'+(F===p)+'">Part '+p+' <small>'+byP[p]+'</small></button>'; })).join(''):'';
    [].forEach.call(tabs.querySelectorAll('[data-f]'),function(b){ b.onclick=function(){ F=+b.dataset.f; render(); }; });
    var V=L.filter(function(x){ return !F||x.p===F; });
    if(!V.length){ main.innerHTML='<div class="card empty"><b class="et">'+(L.length?'Part này không còn câu sai':'Sổ đang trống 🎉')+'</b>'+(L.length?'Chọn Part khác ở trên nhé.':'Làm một đề mini hoặc luyện một Part bất kỳ, câu nào sai sẽ tự vào đây để bạn ôn lại.')+'<br><br><a class="btn" href="mini.html" style="text-decoration:none;display:inline-block">Làm đề mini hôm nay</a></div>'; return; }
    var D=V.filter(function(x){return x.due;}), W=V.filter(function(x){return !x.due;}), h='';
    // 1) đến hạn hôm nay: mỗi đề một nút (dữ liệu tải theo từng đề)
    h+='<h2 class="sec">🔔 Đến hạn ôn hôm nay ('+D.length+' câu)</h2>';
    if(!D.length) h+='<div class="card empty" style="padding:18px 10px"><b class="et">Hôm nay không có câu nào đến hạn 👍</b>Câu sai mới sẽ đến hạn vào ngày mai. Muốn ôn sớm thì bấm vào các câu bên dưới (ôn sớm không tính lượt).</div>';
    else {
      var G={}; D.forEach(function(x){ (G[x.t]=G[x.t]||[]).push(x); });
      h+=Object.keys(G).map(Number).sort(function(a,b){return a-b;}).map(function(t){
        var xs=G[t].sort(function(a,b){return a.n-b.n;}), ns=xs.map(function(x){return x.n;}), P={};
        xs.forEach(function(x){ (P[x.p]=P[x.p]||[]).push(x); });
        return '<div class="grp"><h2>'+tname(t)+'</h2>'+Object.keys(P).map(function(p){
          return '<div class="pr"><div class="pl">Part '+p+'<small>'+PN[p]+' · '+P[p].length+' câu</small></div><div class="ns">'+P[p].map(function(x){ return '<a href="test.html?t='+t+'&m=sai&q='+ns.join(',')+'#q'+x.n+'" title="Lần ôn '+(x.s+1)+'/3">'+x.n+'<small>'+(x.s+1)+'/3</small></a>'; }).join('')+'</div></div>';
        }).join('')+link(t,ns,'↻ Ôn '+xs.length+' câu đến hạn của đề này')+'</div>';
      }).join('');
    }
    // 2) chưa đến hạn: xếp theo ngày
    if(W.length){
      var B={}; W.forEach(function(x){ (B[x.d]=B[x.d]||[]).push(x); });
      h+='<h2 class="sec">🗓️ Chưa đến hạn ('+W.length+' câu)</h2><div class="grp">'+Object.keys(B).sort().map(function(d){
        var T={}; B[d].forEach(function(x){ (T[x.t]=T[x.t]||[]).push(x); });
        return '<div class="pr"><div class="pl">'+dayLbl(d)+'<small>'+B[d].length+' câu</small></div><div class="ns soon">'+Object.keys(T).map(Number).sort(function(a,b){return a-b;}).map(function(t){
          return T[t].sort(function(a,b){return a.n-b.n;}).map(function(x){ return '<a href="test.html?t='+t+'&m=sai&q='+x.n+'" title="'+tname(t)+' · lần ôn '+(x.s+1)+'/3">'+(t>10?'24-'+(t-10):'T'+t)+'·'+x.n+'<small>'+(x.s+1)+'/3</small></a>'; }).join('');
        }).join('')+'</div></div>';
      }).join('')+'</div>';
    }
    main.innerHTML=h+'<p class="hint">Mỗi câu sai được ôn lại 3 lần: sau 1 ngày, 3 ngày rồi 7 ngày. Số nhỏ (1/3, 2/3, 3/3) là lần ôn tiếp theo. Làm sai thì quay lại từ đầu, đúng cả 3 lần thì câu đó rời sổ. Ôn sớm (trước ngày hẹn) thì không tính lượt. Câu chưa đến hạn ghi “T3·101” là Test 3 câu 101 (ETS 2026), “24-1·101” là ETS 2024 Test 1.</p>';
  }
  if(window.MERR) render(); else document.addEventListener('DOMContentLoaded',render);
})();
</script>
<script src="assets/ui.js?v=12"></script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(function(){});});</script>
</body>
</html>
