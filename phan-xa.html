<style>
:root{color-scheme:light;--paper:#faf8f4;--card:#fff;--line:#ddd7c9;--ink:#1e232b;--dim:#666e7a;--panel2:#f2efe8;--brand:#a8691a;--brand-soft:#f2e2c4;--brand-ink:#6b4410;--ok:#1f8f6c;--ok-soft:#e1f4ec;--bad:#c14636;--bad-soft:#fbe6e2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 50px}
header{padding:26px 0 8px}
.mback{font-size:14px;font-weight:700;color:var(--brand-ink);text-decoration:none}
h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:clamp(28px,6vw,40px);margin:10px 0 4px;line-height:1.1}
header p{margin:0;color:var(--dim)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lbl{font-size:13px;font-weight:700;color:var(--dim);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.chip{font:inherit;font-weight:600;font-size:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.chip small{font-weight:500;opacity:.8}
.btn{font:inherit;font-weight:700;font-size:16px;border:0;background:var(--brand);color:#fff;border-radius:12px;padding:12px 20px;cursor:pointer}
.btn.alt{background:var(--card);color:var(--brand-ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.hint{font-size:13px;color:var(--dim)}
.best{display:flex;gap:10px;margin-top:12px}
.best div{flex:1;background:var(--panel2);border-radius:12px;padding:8px 12px}.best b{display:block;font:600 24px/1.1 Fraunces,Georgia,serif;color:var(--brand-ink)}.best span{font-size:12.5px;color:var(--dim)}
/* reflex */
.hud{display:flex;gap:12px;align-items:center;font-weight:700;font-size:14px;margin:10px 0 6px}.hud .sp{margin-left:auto;color:var(--dim);font-weight:600}
.stage{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px;text-align:center}
.ring{position:relative;width:118px;height:118px;margin:4px auto 10px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--panel2)}.ring .fg{stroke:var(--brand);stroke-linecap:round;transition:stroke .2s}
.ring .fg.low{stroke:var(--bad)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 30px/1 Fraunces,Georgia,serif;color:var(--brand-ink)}
.qtxt{font-size:18px;font-weight:600;min-height:28px;margin:4px 0}.qtxt small{display:block;font-size:13.5px;font-weight:400;color:var(--dim)}
.ear{font-size:14px;color:var(--dim);min-height:22px}
.ops{display:grid;gap:8px;margin-top:12px;text-align:left}
.op{display:flex;gap:10px;align-items:flex-start;font:inherit;font-size:16px;background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;color:var(--ink);text-align:left}
.op .L{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid #b9b09c;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--card)}
.op.right{border-color:var(--ok);background:var(--ok-soft)}.op.wrong{border-color:var(--bad);background:var(--bad-soft)}
.op:disabled{cursor:default}.op small{display:block;color:var(--dim);font-size:13px}
.ops.wait .op{opacity:.55}
.res{text-align:center}.res .sc{font:600 56px/1 Fraunces,Georgia,serif;color:var(--brand-ink)}
.wl{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px;text-align:left}
.wl li{background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:14.5px}.wl li b{display:block}.wl .ok{color:var(--ok);font-weight:600}
.wl button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:2px 9px;cursor:pointer;font-size:13px;margin-left:6px}
</style>
</head>
